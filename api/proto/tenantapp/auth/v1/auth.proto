syntax = "proto3";

package tenantapp.auth.v1;

option go_package = "github.com/fiankasepmantea/go-gin-tenant-template/internal/transport/grpc/gen/tenantapp/auth/v1;authv1";

// AuthService lets other services verify tokens and access rights
// without having to share the PASETO_KEY. See docs/grpc.md.
service AuthService {
  // Validate checks an access token and returns its owner's identity. It verifies the token only (signature, expiry);
  // use Authorize to also check that the user still exists and is active.
  rpc Validate(ValidateRequest) returns (ValidateResponse);
  // Authorize checks whether the user may access an endpoint (method + route pattern) in their tenant.
  // allowed=false means refused; the status Unauthenticated means a bad token or a user that is gone or inactive;
  // Internal means "could not decide": treat it as a refusal.
  rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse);
}

message ValidateRequest {
  string access_token = 1;
}

message ValidateResponse {
  string user_id = 1;
  string tenant_id = 2;  // empty for platform admins
  string level = 3;      // "platform" | "tenant"
}

message AuthorizeRequest {
  string access_token = 1;
  string method = 2;     // GET, POST, ...
  string path = 3;       // route pattern, e.g. /users/:id
}

message AuthorizeResponse {
  bool allowed = 1;
}
