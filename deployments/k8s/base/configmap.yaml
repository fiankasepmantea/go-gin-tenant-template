apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-api-config
data:
  APP_ENV: production
  APP_PORT: "8080"
  LOG_LEVEL: info
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: tenantdb
  DB_SCHEMA: public
  DB_SSLMODE: require
  TOKEN_ISSUER: go-gin-tenant-template
  ACCESS_TOKEN_TTL: 15m
  REFRESH_TOKEN_TTL: 720h
  TENANT_HEADER: X-Tenant-Code
  RATE_LIMIT_ATTEMPTS: "5"
  RATE_LIMIT_WINDOW: 15m
  PASSWORD_RESET_TTL: 30m
  # Set per environment (overlay): REDIS_ADDR, SMTP_HOST, SMTP_PORT, SMTP_FROM, SMTP_SECURITY, APP_NAME, PASSWORD_RESET_URL.
  # Secrets (REDIS_PASSWORD, SMTP_USERNAME, SMTP_PASSWORD) go in the Secret, see secret.example.yaml.
