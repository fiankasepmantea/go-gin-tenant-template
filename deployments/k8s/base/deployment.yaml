apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-api
  labels:
    app.kubernetes.io/name: tenant-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tenant-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenant-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/fiankasepmantea/go-gin-tenant-template:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: tenant-api-config
            - secretRef:
                name: tenant-api-secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
